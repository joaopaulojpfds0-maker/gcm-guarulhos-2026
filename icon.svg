<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Shield Shape with Shadow -->
  <g filter="url(#shadow)">
    <path d="M 256 60 C 340 60 410 85 410 85 C 410 260 340 380 256 430 C 172 380 102 260 102 85 C 102 85 172 60 256 60 Z" 
          fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="8"/>
    
    <!-- Inner Shield border -->
    <path d="M 256 80 C 325 80 385 102 385 102 C 385 248 325 352 256 400 C 187 352 127 248 127 102 C 127 102 187 80 256 80 Z" 
          fill="#0f172a" fill-opacity="0.88" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4"/>
  </g>

  <!-- Stars -->
  <polygon points="256,115 264,135 285,135 268,148 274,168 256,155 238,168 244,148 227,135 248,135" fill="url(#goldGrad)"/>
  <polygon points="190,135 196,150 212,150 199,160 204,175 190,165 176,175 181,160 168,150 184,150" fill="url(#goldGrad)" transform="scale(0.85) translate(35, 10)"/>
  <polygon points="322,135 328,150 344,150 331,160 336,175 322,165 308,175 313,160 300,150 316,150" fill="url(#goldGrad)" transform="scale(0.85) translate(65, 10)"/>

  <!-- Texts -->
  <!-- GCM -->
  <text x="256" y="245" font-family="'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">GCM</text>
  
  <!-- GUARULHOS -->
  <text x="256" y="285" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="6">GUARULHOS</text>

  <!-- Divider Line -->
  <line x1="175" y1="305" x2="337" y2="305" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- 2026 Banner -->
  <rect x="180" y="325" width="152" height="42" rx="10" fill="url(#goldGrad)"/>
  <text x="256" y="354" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#0b1329" text-anchor="middle" letter-spacing="3">2026</text>
</svg>
